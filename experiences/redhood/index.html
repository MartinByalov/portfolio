<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Червената шапчица — задача със Scratch</title>
<script type="module" src="../../scripts/accessibility-widget.js"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#e4e8f0;--accent:#e84d67;--accent2:#6c63ff;--shadow:0 14px 40px rgba(26,35,56,.09)}*{box-sizing:border-box}body{margin:0;font:15px/1.55 Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}header{background:linear-gradient(135deg,#fff 0%,#fff4f6 100%);border-bottom:1px solid var(--line)}.wrap{max-width:1460px;margin:auto;padding:22px 28px}.hero{display:flex;align-items:center;justify-content:space-between;gap:24px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}h1{font-size:30px;margin:3px 0 5px}.sub{color:var(--muted);margin:0}.badge{white-space:nowrap;padding:9px 13px;border:1px solid #ffd5dc;border-radius:999px;background:#fff;color:#b62f48;font-weight:700}.tabs{display:flex;gap:8px;margin-top:18px}.tab{border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:10px;font-weight:700;cursor:pointer}.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}main.wrap{padding-top:24px}.grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(480px,.92fr);gap:22px;align-items:start}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}.cardtitle{font-size:16px;font-weight:800}.actions{display:flex;gap:8px}.btn{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-weight:700}.btn.primary{background:var(--accent2);color:#fff;border-color:var(--accent2)}.viewer{width:100%;height:calc(100vh - 215px);min-height:650px;border:0;background:#e8ebf1}.scratchbody{padding:18px}.stage-shell{position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#fff;border:1px solid var(--line)}.stage-shell img{width:100%;height:100%;object-fit:contain}.playoverlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,transparent 55%,rgba(10,15,28,.16))}.play{width:72px;height:72px;border:0;border-radius:50%;background:#39b54a;color:#fff;font-size:30px;box-shadow:0 8px 25px rgba(0,0,0,.18);cursor:pointer}.note{margin-top:14px;padding:13px 14px;border-radius:12px;background:#f7f7ff;border:1px solid #e3e1ff;color:#4b4a69}.note strong{color:#2d2b55}.scratchframe{display:block;width:100%;aspect-ratio:485/402;border:0;border-radius:14px;background:#111}.status{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:13px;margin-top:12px}.dot{width:8px;height:8px;border-radius:50%;background:#f4b740}.foot{color:var(--muted);font-size:13px;margin-top:16px}@media(max-width:1000px){.grid{grid-template-columns:1fr}.viewer{height:720px}.hero{align-items:flex-start;flex-direction:column}.badge{white-space:normal}}@media(max-width:620px){.wrap{padding-left:14px;padding-right:14px}h1{font-size:24px}.viewer{height:600px}.actions{display:none}}
</style>
</head>
<body>
<header><div class="wrap"><div class="hero"><div><div class="eyebrow">Олимпиада по компютърно моделиране · III клас</div><h1>Червената шапчица</h1><p class="sub">Прочети условието и проследи решението като Scratch проект.</p></div></div><div class="tabs"><button class="tab active" onclick="scrollToPanel('task')">Условие</button><button class="tab" onclick="scrollToPanel('scratch')">Scratch</button></div></div></header>
<main class="wrap"><div class="grid">
<section class="card" id="task"><div class="cardhead"><div class="cardtitle">📄 Условие на задачата</div><div class="actions"><a class="btn" href="condition.pdf" target="_blank">Отвори PDF</a><a class="btn" href="condition.pdf" download>Изтегли</a></div></div><object class="viewer" data="condition.pdf#view=FitH" type="application/pdf"><iframe class="viewer" src="condition.pdf"></iframe></object></section>
<section class="card" id="scratch"><div class="cardhead"><div class="cardtitle">🧩 Scratch проект</div><div class="actions"><a class="btn primary" href="https://scratch.mit.edu/projects/1381993725/" target="_blank" rel="noopener">Отвори в Scratch</a></div></div><div class="scratchbody">
<iframe class="scratchframe" src="https://scratch.mit.edu/projects/1381993725/embed" allowtransparency="true" scrolling="no" allowfullscreen></iframe>


</div></section>
</div></main>
<script>function scrollToPanel(id){document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'});document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(window.event?.currentTarget)window.event.currentTarget.classList.add('active')}</script></body></html>
