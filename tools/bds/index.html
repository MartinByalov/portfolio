<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>БДС Клавиатура — Тренировка</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/tools/bds/bds.css">
</head>
<body class="bds-page">
    <div class="bds-wrap">
    <div class="bds-toolbar">
        <h1>БДС Клавиатура</h1>
        <label for="bookSelect">Книга:</label>
        <select id="bookSelect"><option value="">Зареждане…</option></select>
        <button id="newChapterBtn" type="button">↻ Нова глава</button>
    </div>
    <p class="bds-hint">Тренировка за научаване на клавиатурната подредба БДС 5237:1978 — препишете откъса в полето.</p>

    <div class="bds-stats">
        <span class="done">Прогрес: <b id="statProgress">0%</b></span>
        <span>Грешки: <b id="statWrong">0</b></span>
        <span>Точност: <b id="statAccuracy">100%</b></span>
    </div>

    <div class="section2">

        <p id="storyParagraph">Изберете книга, за да се зареди произволна глава за упражнение.</p>
        <figcaption id="bookCaption"></figcaption>
        <textarea id="storyTextArea" placeholder="Текстово поле"></textarea>

        <div class="keyboard" id="keyboard"></div>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="/tools/bds/bds.js"></script>
    <script type="module" src="/tools/embed.js"></script>
</body>
</html>
