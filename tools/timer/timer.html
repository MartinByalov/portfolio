<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Таймер</title>
  <script type="module" src="../../scripts/accessibility-widget.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
    :root {
      --accent: #f17a3e;
      --accent-dark: #e05e1f;
      --dark: #1d1b31;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffb27a 0%, #f17a3e 55%, #e05e1f 100%);
    }
    .timer-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.96);
      border: 4px solid var(--dark);
      border-radius: 24px;
      box-shadow: 0 24px 64px rgba(29, 27, 49, 0.35);
      padding: 32px 28px;
      text-align: center;
    }
    .timer-card.finished { animation: pulse 1s infinite; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 24px 64px rgba(220, 53, 69, 0.35); }
      50%      { box-shadow: 0 24px 64px rgba(220, 53, 69, 0.6); }
    }
    .setup-label {
      display: block;
      font-size: 1.15em;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 20px;
    }
    .time-inputs {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 14px;
      margin-bottom: 24px;
    }
    .time-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .time-field label {
      font-size: 0.85em;
      font-weight: 600;
      color: #666;
    }
    .time-field input {
      width: 86px;
      padding: 10px 6px;
      text-align: center;
      font-family: inherit;
      font-size: 1.6em;
      font-weight: 700;
      color: var(--dark);
      background: #fff;
      border: 3px solid var(--dark);
      border-radius: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .time-field input:focus { border-color: var(--accent); }
    .colon {
      font-size: 2em;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 0 rgba(29, 27, 49, 0.35);
      padding-bottom: 8px;
    }
    .start-btn {
      width: 100%;
      padding: 14px;
      font-family: inherit;
      font-size: 1.2em;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #fff;
      background: linear-gradient(90deg, #f7964f, var(--accent-dark));
      border: 3px solid var(--dark);
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(224, 94, 31, 0.45);
      transition: transform 0.15s, background 0.2s;
    }
    .start-btn:hover { transform: scale(1.03); background: linear-gradient(90deg, var(--accent), #d95a1c); }
    .start-btn:active { transform: scale(0.98); }
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 18px;
    }
    .presets button {
      padding: 7px 16px;
      border: 2px solid var(--dark);
      border-radius: 999px;
      background: #fff;
      color: var(--dark);
      font-family: inherit;
      font-size: 0.9em;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .presets button:hover { background: #fdeadd; }
    .presets button.active { background: var(--accent); color: #fff; }
    .running-view { display: none; }
    .timer-card.running .setup-view { display: none; }
    .timer-card.running .running-view { display: block; }
    .bar-track {
      height: 12px;
      background: #e9ecef;
      border: 2px solid var(--dark);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #f7964f, var(--accent-dark));
      border-radius: 4px;
      transition: width 0.2s linear;
    }
    .bar-fill.low { background: #dc3545; }
    #display {
      font-size: 64px;
      font-weight: 800;
      letter-spacing: 4px;
      color: var(--dark);
      margin: 6px 0 22px;
      font-variant-numeric: tabular-nums;
    }
    .timer-card.finished #display { color: #dc3545; }
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .controls button {
      min-width: 120px;
      padding: 12px;
      font-family: inherit;
      font-size: 1em;
      font-weight: 700;
      border: 3px solid var(--dark);
      border-radius: 999px;
      background: #fff;
      color: var(--dark);
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .controls button:hover { background: #fdeadd; }
    #pauseBtn { background: var(--accent); color: #fff; }
    #pauseBtn:hover { background: var(--accent-dark); }
    .controls button:active { transform: scale(0.97); }
    .status { min-height: 1.4em; font-weight: 600; margin: 16px 0 0; color: var(--dark); }
    .status.error { color: #dc3545; }
    .status.ok { color: #2e9e5b; }
  </style>
</head>
<body>
  <div class="timer-card" id="timer-card">
    <div class="setup-view">
      <span class="setup-label">Задаване на време</span>
      <div class="time-inputs">
        <div class="time-field">
          <label for="minutes">Минути</label>
          <input type="number" id="minutes" min="0" max="180" value="5">
        </div>
        <span class="colon">:</span>
        <div class="time-field">
          <label for="seconds">Секунди</label>
          <input type="number" id="seconds" min="0" max="59" value="0">
        </div>
      </div>
      <button id="startBtn" class="start-btn">🚀 Старт!</button>
      <div class="presets">
        <button class="preset" data-ms="60000">1 мин</button>
        <button class="preset active" data-ms="300000">5 мин</button>
        <button class="preset" data-ms="600000">10 мин</button>
      </div>
    </div>

    <div class="running-view">
      <div class="bar-track"><div class="bar-fill" id="bar"></div></div>
      <div id="display">05:00</div>
      <div class="controls">
        <button id="pauseBtn">Пауза</button>
        <button id="resetBtn">Нулирай</button>
      </div>
    </div>

    <p class="status" id="status"></p>
  </div>

  <script>
    (function () {
      const card = document.getElementById('timer-card');
      const display = document.getElementById('display');
      const bar = document.getElementById('bar');
      const startBtn = document.getElementById('startBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const resetBtn = document.getElementById('resetBtn');
      const minutesEl = document.getElementById('minutes');
      const secondsEl = document.getElementById('seconds');
      const statusEl = document.getElementById('status');
      const presets = document.querySelectorAll('.preset');

      let totalMs = 5 * 60 * 1000;
      let remainingMs = totalMs;
      let endAt = null;
      let ticker = null;
      let audioCtx = null;

      function fmt(ms) {
        const s = Math.max(0, Math.ceil(ms / 1000));
        const m = Math.floor(s / 60);
        const sec = s % 60;
        return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
      }

      function say(text, type) {
        statusEl.textContent = text;
        statusEl.className = 'status' + (type ? ' ' + type : '');
      }

      function paint() {
        display.textContent = fmt(remainingMs);
        bar.style.width = (totalMs > 0 ? (remainingMs / totalMs) * 100 : 0) + '%';
        bar.classList.toggle('low', remainingMs > 0 && remainingMs <= 10000);
        document.title = remainingMs > 0 ? `${fmt(remainingMs)} – Таймер` : 'Таймер';
      }

      function stopTicking() {
        if (ticker) {
          clearInterval(ticker);
          ticker = null;
        }
      }

      function showSetup() { card.classList.remove('running'); }
      function showRunning() { card.classList.add('running'); }

      function setDuration(ms) {
        stopTicking();
        totalMs = ms;
        remainingMs = ms;
        card.classList.remove('finished');
        pauseBtn.textContent = 'Пауза';
        paint();
      }

      function ensureAudio() {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      }

      function beep() {
        if (!audioCtx) return;
        [0, 350, 700].forEach(delay => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = 880;
          const t0 = audioCtx.currentTime + delay;
          gain.gain.setValueAtTime(0.001, t0);
          gain.gain.exponentialRampToValueAtTime(0.4, t0 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.3);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(t0);
          osc.stop(t0 + 0.35);
        });
      }

      function tick() {
        remainingMs = endAt - Date.now();
        if (remainingMs <= 0) {
          remainingMs = 0;
          paint();
          finish();
          return;
        }
        paint();
      }

      function finish() {
        stopTicking();
        card.classList.add('finished');
        say('Времето изтече!', 'error');
        beep();
      }

      function startTimer() {
        const m = Math.max(0, parseInt(minutesEl.value, 10) || 0);
        const s = Math.max(0, parseInt(secondsEl.value, 10) || 0);
        if (m > 180 || s > 59 || (m === 0 && s === 0)) {
          say('Задай валидно време (напр. 5 мин 0 сек).', 'error');
          return;
        }
        setDuration((m * 60 + s) * 1000);
        say('');
        showRunning();
        ensureAudio();
        endAt = Date.now() + remainingMs;
        ticker = setInterval(tick, 200);
        paint();
      }

      function pauseResume() {
        if (card.classList.contains('finished')) return;
        if (ticker) {
          stopTicking();
          remainingMs = endAt - Date.now();
          pauseBtn.textContent = 'Продължи';
          say('Пауза.', 'ok');
          return;
        }
        ensureAudio();
        endAt = Date.now() + remainingMs;
        ticker = setInterval(tick, 200);
        pauseBtn.textContent = 'Пауза';
        say('');
      }

      function reset() {
        stopTicking();
        card.classList.remove('finished');
        say('');
        showSetup();
        minutesEl.value = Math.floor(totalMs / 60000);
        secondsEl.value = (totalMs % 60000) / 1000;
      }

      presets.forEach(btn => btn.addEventListener('click', () => {
        presets.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const ms = parseInt(btn.dataset.ms, 10);
        setDuration(ms);
        minutesEl.value = Math.floor(ms / 60000);
        secondsEl.value = (ms % 60000) / 1000;
        say('');
      }));

      startBtn.addEventListener('click', startTimer);
      pauseBtn.addEventListener('click', pauseResume);
      resetBtn.addEventListener('click', reset);

      document.addEventListener('keydown', e => {
        if (e.code !== 'Space') return;
        const tag = document.activeElement && document.activeElement.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'BUTTON') return;
        e.preventDefault();
        if (!card.classList.contains('running')) startTimer();
        else pauseResume();
      });

      paint();
    })();
  </script>
</body>
</html>
